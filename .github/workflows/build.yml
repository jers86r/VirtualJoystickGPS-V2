name: Build Virtual Joystick GPS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract corrected project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE='./VirtualJoystickGPS_V2_Editable_Coordinates_MOCKFIX.zip'
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_MOCK_LOCATION' project/app/src/main/AndroidManifest.xml
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' project/app/build.gradle.kts
          grep -q 'jvmTarget = "17"' project/app/build.gradle.kts
          grep -qi 'latitude' project/app/src/main/java/com/example/virtualjoystickgps/MainActivity.kt

      - name: Build APK
        shell: bash
        run: gradle -p project --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualJoystickGPS-V2-MockLocation-Fixed
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
