
name: Build Virtual Joystick GPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f project/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Add mock location permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.ACCESS_MOCK_LOCATION" />'

          if "android.permission.ACCESS_MOCK_LOCATION" not in s:
              pos = s.find(">")
              if pos < 0:
                  raise SystemExit("ERROR: Invalid AndroidManifest.xml")
              s = s[:pos + 1] + "\n" + permission + s[pos + 1:]
              p.write_text(s)

          print("Mock location permission added.")
          PY

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.virtualjoystickgps"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.virtualjoystickgps"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Verify mock location permission
        shell: bash
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualJoystickGPS-V2-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
